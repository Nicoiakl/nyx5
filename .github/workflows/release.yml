# Publicar en npm sin que dependa de que Nicholas esté frente al teclado.
#
# El 0.7.0 salió el 14-sep-2026 y el siguiente nunca salió: `npm publish` pedía su código 2FA,
# así que la publicación dejó de ocurrir y se acumularon 61 commits — adjuntos, ejecutor, QA —
# invisibles para cualquiera de fuera. La puerta de entrada servía septiembre.
#
# Ahora publica la casa, no el Mac. Y lo hace SIN ningún secreto: GitHub le prueba a npm quién es
# (OIDC, «trusted publisher»), así que no hay token que robar, que rotar ni que se venza. El primer
# intento, el 3-nov, fue con un token de automatización y npm lo rechazó con E_STAGE_REQUIRED: los
# tokens nuevos sólo pueden dejar la versión en una sala de espera, porque npm está retirando los
# que se saltan el 2FA. Este camino es el que npm quiere y el que sobrevive a ese retiro.
#
# Exige, una sola vez, en npmjs.com -> el paquete -> Trusted Publisher: GitHub Actions, repo
# Nicoiakl/nyx5, workflow `release.yml`, y marcar que se permite `npm publish` DIRECTO — las
# configuraciones nuevas nacen en «sólo sala de espera» y sin esa marca vuelve a fallar igual.
#
#   npm version minor && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']
  # Para reintentar sin mover la etiqueta: un intento fallido en el último paso no debería costar
  # un empujón más. Publica la versión que diga package.json en la rama elegida.
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # para crear el GitHub Release de la etiqueta (ver el último paso)
      id-token: write      # con esto npm sabe que es este repo: autentica la publicación y firma la procedencia
    steps:
      - uses: actions/checkout@v4
      # SIN `registry-url`, y es el punto entero. Con él, setup-node escribe un .npmrc con un token
      # de RELLENO (`XXXXX-XXXXX-XXXXX-XXXXX`) y npm lo manda como credencial en vez de preguntarle
      # a GitHub quién es: el registro contesta 404 y la publicación muere. Pasó el 3-nov, en el
      # último paso, por segunda vez en el día. npm apunta al registro público por defecto.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # OIDC necesita npm 11.5.1+. El runner trae uno nuevo, pero que una publicación muera en el
      # último paso ya pasó una vez: se comprueba antes y se dice en una línea qué falta.
      - name: npm sabe autenticarse por OIDC, y no hay credencial que lo tape
        run: |
          v="$(npm -v)"
          echo "npm $v"
          [ "$(printf '11.5.1\n%s\n' "$v" | sort -V | head -1)" = "11.5.1" ] \
            || { echo "npm $v no publica por OIDC: hace falta 11.5.1+"; exit 1; }
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] \
            || { echo "sin ACTIONS_ID_TOKEN_REQUEST_URL: falta permissions.id-token: write"; exit 1; }
          [ -z "$NODE_AUTH_TOKEN" ] \
            || { echo "hay NODE_AUTH_TOKEN en el entorno: npm lo usaría en vez del OIDC"; exit 1; }
          echo "token configurado para el registro: $(npm config get //registry.npmjs.org/:_authToken)"
      # Cero dependencias: no hay `npm install`.
      - name: Pruebas
        run: npm test
      # La etiqueta y el package.json tienen que decir lo mismo: una etiqueta que no corresponde
      # publica una versión que nadie revisó.
      - name: La etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          paquete="$(node -p 'require("./package.json").version')"
          [ "$etiqueta" = "$paquete" ] || { echo "etiqueta $etiqueta != package.json $paquete"; exit 1; }
      # Sin NODE_AUTH_TOKEN a propósito: la autenticación es el OIDC de arriba. La procedencia va
      # igual — npm firma que este tarball salió de ESTE commit y de ESTE workflow.
      - name: Publicar
        run: npm publish --provenance --access public
      # La página de Releases es lo primero que mira quien evalúa si un proyecto sigue vivo, y
      # GitHub es la superficie por la que de verdad nos encuentran: el dominio no está indexado.
      # El 5-nov había 17 etiquetas empujadas y UN solo release, el v0.4.0 del 8-sep: dos meses de
      # trabajo invisibles para quien llega. Una etiqueta no es un release — es el mismo error que
      # «npm y el repo dicen el mismo número»: parecía al día mirando lo que no era.
      # Va DESPUÉS de npm a propósito: anunciar una versión que npm no sirve es prometer de gratis.
      - name: Dejar el release de GitHub al día
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME}"
          if gh release view "$v" >/dev/null 2>&1; then echo "release $v ya existe"; exit 0; fi
          gh release create "$v" \
            --title "Nyx5 ${v#v}" \
            --generate-notes \
            --verify-tag
          echo "release $v creado"
          # Contra el terreno, no contra la salida de gh (§1): se le pregunta a la API.
          gh release view "$v" --json tagName,isDraft \
            --jq 'if .isDraft then error("quedó en borrador: nadie lo ve") else "publicado: " + .tagName end'
