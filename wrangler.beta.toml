# Nyx5 — segunda casa b.nyx5.com (federación). Secret: NYX5_ADMIN_TOKEN.
# Migrada desde b.chsq.uk (D1 viejo "chsq-b" abandonado). b.chsq.uk queda como alias.
# El nombre del Worker sigue siendo "chsq-b" a propósito (ver wrangler.toml).
name = "chsq-b"
main = "src/plataformas/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "b.nyx5.com", custom_domain = true },
  { pattern = "b.chsq.uk", custom_domain = true },
]

[vars]
NYX5_DOMAIN = "b.nyx5.com"
NYX5_PUBLIC_URL = "https://b.nyx5.com"
NYX5_REGISTRATION = "invite"
NYX5_TERMS = "on"
NYX5_WELCOME = "0"
# Mismo fee que la casa principal: 0,5% sobre el trabajo, 0% entre personas (decisión del 11-sep).
NYX5_FEE_BPS = "50"
NYX5_INDEX = "off"

[[d1_databases]]
binding = "DB"
database_name = "nyx5-b"
database_id = "d3f84b7c-8053-4b71-bc41-3c337abd2d8c"

[triggers]
crons = ["* * * * *"]
